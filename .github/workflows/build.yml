name: Windows client build and verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish verified Windows client to Releases
        type: boolean
        default: false
      release_tag:
        description: Release tag (vMAJOR.MINOR.PATCH)
        type: string
        default: v0.2.0
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - name: Rust core and controller regression tests
        run: cargo test --workspace --locked
      - name: Rust formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --locked -- -D warnings
      - name: HTML interaction and visual verification
        run: |
          npx playwright install chromium
          npm run test:web
      - name: Build portable EXE and installer with shared WebView2
        run: npm run tauri -- build --target x86_64-pc-windows-msvc
      - name: Collect Windows clients
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/portable, artifacts/install | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/delta-force-filter-manager.exe artifacts/portable/DeltaForceFilterManager.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe artifacts/install/DeltaForceFilterManager-setup.exe
          Copy-Item README.md, LICENSE artifacts/portable/
      - name: Native WebView IPC, screenshot and complete process-tree idle sample
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaForceFilterManager-win-x64
          path: artifacts/
          retention-days: 30
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeltaForceFilterManager-win-x64
          path: artifacts
      - name: Publish verified clients as latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $expectedTag = 'v' + ((Get-Content package.json -Raw | ConvertFrom-Json).version)
          if ($env:RELEASE_TAG -ne $expectedTag) { throw 'Release tag and package version differ.' }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag.' }
          $exe = "DeltaForceFilterManager-$($env:RELEASE_TAG)-win-x64.exe"
          $zip = "DeltaForceFilterManager-$($env:RELEASE_TAG)-win-x64-portable.zip"
          $setup = "DeltaForceFilterManager-$($env:RELEASE_TAG)-win-x64-setup.exe"
          Copy-Item artifacts/portable/DeltaForceFilterManager.exe $exe
          Copy-Item artifacts/install/DeltaForceFilterManager-setup.exe $setup
          Compress-Archive -Path artifacts/portable/* -DestinationPath $zip
          $files = @($exe, $zip, $setup)
          $checksums = $files | ForEach-Object { $hash=Get-FileHash $_ -Algorithm SHA256; "$($hash.Hash.ToLower())  $_" }
          $checksums | Set-Content SHA256SUMS.txt -Encoding utf8
          $rows = $files | ForEach-Object { "| ``$_`` | $([Math]::Round((Get-Item $_).Length / 1MB, 2)) MiB |" }
          @"
          全新 HTML 界面，Rust + Tauri 2 后台，使用系统 WebView2。修复方案切换只更新预览、ICC/NVIDIA 后续操作覆盖 Gamma 的时序缺陷；完整参数事务 + 延迟复查 + 有限重试 + 失败恢复。

          **客户端下载**：安装版选择 win-x64-setup.exe；便携版选择 win-x64-portable.zip，解压运行 DeltaForceFilterManager.exe。单独 EXE 也可直接运行。三种均不捆绑 .NET、Chromium 或完整 WebView2；安装器在缺少 WebView2 时联网安装共享运行时。

          | 客户端 | 下载大小 |
          | --- | --- |
          $($rows -join "`n")

          支持 Windows 10/11 x64、SDR；本机参考图片分屏对照、ICC 管理、NVIDIA 数字振动、游戏进程联动、自启、托盘与恢复。关闭到托盘会销毁 WebView。

          核心/控制器回归测试、HTML 交互测试、Windows 原生 IPC 模拟验证已通过，附界面和包含 WebView2 子进程的短时空闲采样。模拟测试没有操作真实显示器；NVIDIA 实机、游戏独占全屏和游戏电脑资源表现仍需验证。后续其他程序或系统切换仍可能覆盖 Gamma，请重新应用。

          v0.1.0 的约 47 MB ZIP 包含完整 .NET Desktop Runtime；本版已移除该运行时依赖。旧设置与恢复备份格式兼容。详见包内 README。
          "@ | Set-Content release-notes.md -Encoding utf8
          gh release create $env:RELEASE_TAG $files SHA256SUMS.txt artifacts/ui/workspace.png artifacts/ui/settings.png artifacts/ui/compact.png artifacts/native/idle.json artifacts/native/smoke.json --target $env:RELEASE_SHA --title "DeltaForce Filter $($env:RELEASE_TAG) · HTML 客户端" --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
